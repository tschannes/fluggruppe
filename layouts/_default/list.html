{{ define "main" }}
<div class="page-hero page-hero-inner">
  <div class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <ol>
        <li><a href="{{ "/" | relURL }}">Startseite</a></li>
        <li aria-current="page">{{ .Title }}</li>
      </ol>
    </nav>
    <h1 class="page-title">{{ .Title }}</h1>
  </div>
</div>

<main class="page-main section" id="main-content">
  <div class="container">
    {{ with .Content }}
      <div class="prose container-narrow" style="margin-bottom: 3rem;">{{ . }}</div>
    {{ end }}

    {{ if .Pages }}
      <div class="blog-grid">
        {{ range .Pages }}
          <article class="news-card">
            {{ if .Params.image }}
              <a href="{{ .RelPermalink }}" class="news-card-img-wrap">
                <img src="{{ .Params.image }}" alt="{{ .Title }}" loading="lazy" />
              </a>
            {{ end }}
            <div class="news-card-body">
              <time class="news-card-date" datetime="{{ dateFormat "2006-01-02" .Date }}">{{ dateFormat "02. January 2006" .Date }}</time>
              <h2 class="news-card-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
              <p class="news-card-excerpt">{{ .Description }}</p>
              <a href="{{ .RelPermalink }}" class="news-card-link">Mehr lesen →</a>
            </div>
          </article>
        {{ end }}
      </div>
    {{ end }}
  </div>
</main>
{{ end }}
